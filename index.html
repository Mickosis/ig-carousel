<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carousel Splitter</title>
<style>
  :root {
    --bg: #f6f6f4;
    --panel: #ffffff;
    --text: #1b1b1b;
    --muted: #6b6b6b;
    --border: #dcdcd8;
    --accent: #d6336c;
    --accent-text: #ffffff;
    --error-bg: #fdecec;
    --error-text: #a11d1d;
    --guide: rgba(255, 255, 255, 0.9);
    --guide-shadow: rgba(0, 0, 0, 0.6);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --panel: #1e1e1e;
      --text: #ececec;
      --muted: #9a9a9a;
      --border: #333333;
      --accent: #f06595;
      --accent-text: #141414;
      --error-bg: #3a1a1a;
      --error-text: #ffb3b3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  #drop {
    display: block;
    border: 2px dashed var(--border);
    border-radius: 12px;
    background: var(--panel);
    padding: 36px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop.over { border-color: var(--accent); }
  #drop strong { color: var(--accent); }
  #file { display: none; }

  #error {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--error-bg);
    color: var(--error-text);
  }

  #result { display: none; margin-top: 24px; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .meta { color: var(--muted); }
  button {
    font: inherit;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    padding: 8px 16px;
  }

  .full { position: relative; line-height: 0; border-radius: 8px; overflow: hidden; }
  .full img { width: 100%; height: auto; display: block; }
  .guide {
    position: absolute; top: 0; bottom: 0; width: 0;
    border-left: 2px dashed var(--guide);
    filter: drop-shadow(0 0 1px var(--guide-shadow));
    pointer-events: none;
  }

  #slides {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin-top: 20px;
  }
  .slide {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
  }
  .slide img { width: 100%; aspect-ratio: 3 / 4; display: block; border-radius: 6px; }
  .slide .row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px;
  }
  .slide .num { font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>IG Carousel Splitter</h1>
  <p class="sub">Drop a panorama that is 1440px tall and a multiple of 1080px wide. It gets cut into lossless 1080×1440 PNG slides.</p>

  <label id="drop">
    <input id="file" type="file" accept="image/*">
    Drop an image here or <strong>click to choose</strong>
  </label>

  <div id="error"></div>

  <section id="result">
    <div class="bar">
      <span class="meta" id="meta"></span>
      <button class="primary" id="all">Download all</button>
    </div>
    <div class="full" id="full"></div>
    <div id="slides"></div>
  </section>
</main>

<script>
const SLIDE_W = 1080;
const SLIDE_H = 1440;

const $ = (id) => document.getElementById(id);
const state = { slides: [], previewUrl: null };

function reset() {
  for (const s of state.slides) URL.revokeObjectURL(s.url);
  if (state.previewUrl) URL.revokeObjectURL(state.previewUrl);
  state.slides = [];
  state.previewUrl = null;
  $('error').style.display = 'none';
  $('result').style.display = 'none';
  $('full').replaceChildren();
  $('slides').replaceChildren();
}

function showError(msg) {
  $('error').textContent = msg;
  $('error').style.display = 'block';
}

function baseName(name) {
  const dot = name.lastIndexOf('.');
  return dot > 0 ? name.slice(0, dot) : name;
}

function canvasToPng(canvas) {
  return new Promise((resolve, reject) => {
    canvas.toBlob((b) => b ? resolve(b) : reject(new Error('PNG encode failed')), 'image/png');
  });
}

function download(slide) {
  const a = document.createElement('a');
  a.href = slide.url;
  a.download = slide.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function handleFile(file) {
  reset();
  if (!file) return;

  let bmp;
  try {
    bmp = await createImageBitmap(file);
  } catch {
    showError(`Could not read "${file.name}" as an image.`);
    return;
  }

  const { width, height } = bmp;
  if (height !== SLIDE_H || width < SLIDE_W || width % SLIDE_W !== 0) {
    const examples = [2, 3, 4, 5, 6].map((n) => n * SLIDE_W).join(' / ');
    showError(
      `"${file.name}" is ${width}×${height}. It needs to be exactly ${SLIDE_H}px tall ` +
      `and a multiple of ${SLIDE_W}px wide (e.g. ${examples}…).`
    );
    bmp.close();
    return;
  }

  const count = width / SLIDE_W;
  const base = baseName(file.name);

  for (let i = 0; i < count; i++) {
    const canvas = document.createElement('canvas');
    canvas.width = SLIDE_W;
    canvas.height = SLIDE_H;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(bmp, i * SLIDE_W, 0, SLIDE_W, SLIDE_H, 0, 0, SLIDE_W, SLIDE_H);
    const blob = await canvasToPng(canvas);
    const name = `${base}_${String(i + 1).padStart(2, '0')}.png`;
    state.slides.push({ blob, name, url: URL.createObjectURL(blob) });
  }
  bmp.close();

  render(file, count, width, height);
}

function render(file, count, width, height) {
  $('meta').textContent = `${file.name} · ${width}×${height} · ${count} slides`;

  state.previewUrl = URL.createObjectURL(file);
  const img = document.createElement('img');
  img.src = state.previewUrl;
  img.alt = 'Full image';
  $('full').appendChild(img);
  for (let i = 1; i < count; i++) {
    const g = document.createElement('div');
    g.className = 'guide';
    g.style.left = `calc(${(i / count) * 100}% - 1px)`;
    $('full').appendChild(g);
  }

  state.slides.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'slide';
    const thumb = document.createElement('img');
    thumb.src = s.url;
    thumb.alt = s.name;
    const row = document.createElement('div');
    row.className = 'row';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(i + 1).padStart(2, '0');
    const btn = document.createElement('button');
    btn.textContent = 'Download';
    btn.addEventListener('click', () => download(s));
    row.append(num, btn);
    card.append(thumb, row);
    $('slides').appendChild(card);
  });

  $('result').style.display = 'block';
}

$('all').addEventListener('click', () => {
  state.slides.forEach((s, i) => setTimeout(() => download(s), i * 150));
});

$('file').addEventListener('change', (e) => {
  handleFile(e.target.files[0]);
  e.target.value = '';
});

const drop = $('drop');
['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => {
  e.preventDefault();
  drop.classList.add('over');
}));
['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => {
  e.preventDefault();
  drop.classList.remove('over');
}));
drop.addEventListener('drop', (e) => handleFile(e.dataTransfer.files[0]));

// Let a drop anywhere on the page work, and keep the browser from opening the file instead.
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  if (!drop.contains(e.target)) handleFile(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
